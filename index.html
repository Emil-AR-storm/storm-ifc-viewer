<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23272E">
<title>Storm Prosjekter</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600&display=swap">
<link rel="stylesheet" href="css/storm.css">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.18.0/lib/msal-browser.min.js"></script>
</head>
<body>
<header class="topp">
  <a class="topp-logo" href="#/" aria-label="Til prosjektlista"><img src="img/storm-logo-negativ.png" alt="Storm" width="1000" height="367"></a>
  <span class="topp-tittel">Prosjekter</span>
  <button type="button" class="qr-knapp" id="qr-knapp" aria-label="Vis QR-kode for å åpne siden på telefon">QR</button>
  <span class="topp-bruker" id="topp-bruker"></span>
</header>
<div class="qr-bakgrunn" id="qr-dialog" hidden>
  <div class="qr-boks" role="dialog" aria-modal="true" aria-labelledby="qr-tittel">
    <h2 id="qr-tittel">Åpne på telefon</h2>
    <img src="img/qr-storm-prosjekter.svg" alt="QR-kode til Storm Prosjekter" width="240" height="240">
    <p class="muted liten">Skann med kameraet på telefonen.<br><span id="qr-url"></span></p>
    <div class="qr-knapper">
      <button type="button" class="knapp primar" id="qr-kopier">Kopier lenke</button>
      <button type="button" class="knapp" id="qr-lukk">Lukk</button>
    </div>
  </div>
</div>
<main id="app"><p class="laster">Logger inn …</p></main>
<div id="melding" class="melding" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/graph.js"></script>
<script src="js/app.js"></script>
</body>
</html>
